name: Publish Kit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test
        run: |
          set -euo pipefail
          docker compose run --rm -T test sh -c 'npm test && npm run build'
          docker compose run --rm -T cgroup
          docker compose run --rm -T windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm install --global --ignore-scripts npm@11.19.1
      - name: Derive the version from the content
        id: version
        run: |
          set -euo pipefail
          version=$(node scripts/version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@agentshouse/kit@$version" version --prefer-online >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@agentshouse/kit@$version is already published"
          fi
          draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = false ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = true ]; then
            gh release delete "v$version" --yes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp the version
        if: steps.version.outputs.published != 'true'
        run: |
          set -euo pipefail
          npm version --no-git-tag-version "${{ steps.version.outputs.version }}"
          mkdir -p tmp
          npm pack --pack-destination tmp
          mv tmp/agentshouse-kit-*.tgz tmp/kit.tgz
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: steps.version.outputs.published != 'true' && steps.version.outputs.released != 'true'
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.version.outputs.published != 'true' && steps.version.outputs.released != 'true'
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: steps.version.outputs.published != 'true' && steps.version.outputs.released != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image and the release
        if: steps.version.outputs.published != 'true' && steps.version.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 --tag "ghcr.io/agentshouse/kit:v$VERSION" --metadata-file tmp/image.json --push .
          digest=$(node -p "require('./tmp/image.json')['containerimage.digest']")
          docker buildx imagetools inspect --raw "ghcr.io/agentshouse/kit@$digest" > tmp/manifest.json
          node -e "const m=require('./tmp/manifest.json'); const p=m.manifests.map(x=>x.platform.os+'/'+x.platform.architecture); if(!p.includes('linux/amd64')||!p.includes('linux/arm64')) process.exit(1)"
          npm run release-files -- tmp/kit.tgz tmp/release
          kit=$(sha256sum "tmp/release/kit-$VERSION.tar.gz" | cut -d ' ' -f 1)
          adapters=$(cd tmp/release && for archive in *.tar.gz; do [ "$archive" = "kit-$VERSION.tar.gz" ] || printf '%s=%s ' "$archive" "$(sha256sum "$archive" | cut -d ' ' -f 1)"; done)
          sed -e "s/__IMAGE_DIGEST__/${digest#sha256:}/" -e "s/__KIT_RELEASE__/$VERSION/" -e "s/__KIT_SHA256__/$kit/" -e "s/__ADAPTERS__/${adapters% }/" bin/connect-linux.sh > tmp/release/connect-linux.sh
          sed -e "s/__IMAGE_DIGEST__/${digest#sha256:}/" -e "s/__KIT_RELEASE__/$VERSION/" bin/connect-windows.ps1 > tmp/release/connect-windows.ps1
          npm run bootstrap-manifest -- tmp/release "$digest"
          mkdir -p tmp/building/kit-installer
          cp tmp/release/*.tar.gz tmp/building/kit-installer/
          for node in $(node -p "Object.keys(require('./tmp/release/bootstrap.json').files).filter(n=>/^node-v.*-linux-/.test(n)).join(' ')"); do
            curl -fsSL -o "tmp/building/kit-installer/$node" "$(node -p "require('./tmp/release/bootstrap.json').files['$node'].from")"
          done
          python3 -m http.server --bind 127.0.0.1 --directory tmp/building 8079 >/dev/null 2>&1 &
          for arch in amd64 arm64; do
            platform=$(node -p "require('./tmp/manifest.json').manifests.find(x=>x.platform.architecture==='$arch').digest")
            image="ghcr.io/agentshouse/kit@$platform"
            if ! docker run --rm --quiet --platform "linux/$arch" --entrypoint sh "$image" -c '! command -v node && [ ! -e /usr/local/lib/node_modules ]' >/dev/null; then
              printf '::error::the linux/%s image carries a Node.js runtime or a Kit release\n' "$arch"
              exit 1
            fi
            home=$(mktemp -d)
            docker run --rm -i --network host --platform "linux/$arch" -v "$home:/kit-home" --entrypoint bash "$image" -s - --house http://127.0.0.1:8079 --place /kit-home/kit < tmp/release/connect-linux.sh
            output=$(docker run --rm --platform "linux/$arch" -v "$home:/kit-home" "$image" invalid-command 2>&1 || true)
            if [[ "$output" != *'usage: kit '* ]]; then
              printf '::error::the release placed in Kit home did not start on linux/%s: %s\n' "$arch" "$output"
              exit 1
            fi
            found=$(docker run --rm --platform "linux/$arch" -v "$home:/kit-home" --entrypoint bash "$image" -lc 'command -v kit house' 2>&1 || true)
            if [[ "$found" != $'/kit-home/kit/bin/kit\n/kit-home/kit/bin/house' ]]; then
              printf '::error::a login shell on linux/%s does not find kit and house in Kit home: %s\n' "$arch" "$found"
              exit 1
            fi
          done
          gh release create "v$VERSION" tmp/release/* --target "$GITHUB_SHA" --title "Kit v$VERSION" --notes "Image: ghcr.io/agentshouse/kit@$digest"
          gh release download "v$VERSION" --dir tmp/release-readback
          diff -r tmp/release tmp/release-readback
      - name: Publish the package as latest
        if: steps.version.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm publish --access public --provenance --tag latest
          for attempt in $(seq 1 90); do
            [ "$(npm view "@agentshouse/kit@latest" version --prefer-online 2>/dev/null)" = "$VERSION" ] && exit 0
            # npm served 0.2.1-c3e4a20bb3183 as latest more than five minutes after its publish
            sleep 10
          done
          echo "::error::npm does not read back @agentshouse/kit@$VERSION as latest"
          exit 1
