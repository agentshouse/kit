name: Publish House Kit

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.19.0
      - run: npm ci
      - run: npm run build
      - name: Publish the package
        run: |
          version=$(node -p "require('./package.json').version")
          if ! npm view "@agentshouse/kit@$version" version >/dev/null 2>&1; then
            npm publish --access public --provenance --tag latest
          fi
      - name: Pack the image's package
        run: |
          mkdir -p tmp
          npm pack --pack-destination tmp
          mv tmp/agentshouse-kit-*.tgz tmp/kit.tgz
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          docker buildx build --platform linux/amd64,linux/arm64 --tag "ghcr.io/agentshouse/kit:v$version" --metadata-file tmp/image.json --push .
          digest=$(node -p "require('./tmp/image.json')['containerimage.digest']")
          for arch in amd64 arm64; do
            output=$(docker run --rm --platform "linux/$arch" "ghcr.io/agentshouse/kit@$digest" invalid-command 2>&1 || true)
            if [[ "$output" != 'usage: kit '* ]]; then
              printf '::error::Kit did not start on linux/%s: %s\n' "$arch" "$output"
              exit 1
            fi
          done
          gh release create "v$version" --target "$GITHUB_SHA" --title "House Kit v$version" --notes "Image: ghcr.io/agentshouse/kit@$digest"
