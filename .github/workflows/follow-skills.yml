name: Follow the Skills package

on:
  schedule:
    # The Skills package changes at most daily, so a daily move keeps the Kit's Skill set at most a day behind it.
    - cron: '53 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: follow-skills
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --global --ignore-scripts npm@11.19.0
      - run: node scripts/follow-skills.mjs
      - name: Land the moved version and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "The Kit already installs the Skills package's latest"
            exit 0
          fi
          version=$(node -p "require('./package.json').dependencies['@agentshouse/skills']")
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "The Kit installs @agentshouse/skills $version"
          git push origin HEAD:main
          gh workflow run publish.yml --ref main
