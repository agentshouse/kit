name: Follow the Skills and Kit wire packages

on:
  schedule:
    # A daily move keeps every Kit release at most a day behind npm's latest Skills and Kit wire packages for two npm reads a day.
    - cron: '53 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: follow-skills-and-kit-wire
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm install --global --ignore-scripts npm@11.19.1
      - id: follow
        run: |
          set -euo pipefail
          subject=$(npm run --silent follow-skills-and-kit-wire)
          echo "$subject"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - name: Land the moved versions and publish them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT: ${{ steps.follow.outputs.subject }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "$SUBJECT"
          git push origin HEAD:main
          gh workflow run publish.yml --ref main
